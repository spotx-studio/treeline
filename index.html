<style>
  :root{
    --mono100:#FFFFFF; --mono200:#F6F6F6; --mono300:#EEEEEE; --mono400:#E2E2E2;
    --mono500:#CBCBCB; --mono600:#AFAFAF; --mono700:#757575; --mono800:#545454;
    --mono900:#333333; --mono1000:#000000;
    --blue:#276EF1; --blue-l:#EFF3FE; --blue-ll:#E4EBFD; --blue-d:#174EB6; --blue-dd:#123A87;
    --pos:#05944F; --pos-l:#E6F2ED;
    --neg:#E11900; --neg-l:#FFEFED; --neg-ll:#FFD9D4; --neg-d:#AB1300;
    --warn-l:#FFF7EC;
    --r:8px;
  }
  #tt *{box-sizing:border-box;}
  #tt{
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans TC',Roboto,Helvetica,Arial,sans-serif;
    color:var(--mono1000); background:var(--mono100);
    -webkit-font-smoothing:antialiased; line-height:1.45; position:relative; min-height:100vh;
  }
  /* minimal reset — must NOT set background/border/color, or it out-specifies every class below */
  #tt button{font:inherit;cursor:pointer;}
  #tt input,#tt textarea{font-family:inherit;}
  #tt button:focus-visible,#tt input:focus-visible,#tt textarea:focus-visible{outline:2px solid var(--blue);outline-offset:2px;}

  /* ---------- buttons ---------- */
  .b{
    display:inline-flex;align-items:center;justify-content:center;gap:7px;
    padding:11px 18px;border:none;border-radius:var(--r);font-size:14px;font-weight:600;
    background:var(--mono1000);color:var(--mono100);
    transition:background .12s,transform .06s,opacity .12s;user-select:none;
  }
  .b:hover{background:var(--mono900);}
  .b:active{background:var(--mono800);transform:scale(.985);}
  .b.pri{background:var(--blue);color:#fff;}
  .b.pri:hover{background:var(--blue-d);}
  .b.pri:active{background:var(--blue-dd);}
  .b.sec{background:var(--mono200);color:var(--mono1000);}
  .b.sec:hover{background:var(--mono300);}
  .b.sec:active{background:var(--mono400);}
  .b.min{background:transparent;color:var(--mono900);}
  .b.min:hover{background:var(--mono200);}
  .b.min:active{background:var(--mono300);}
  .b.dgr{background:transparent;color:var(--neg);}
  .b.dgr:hover{background:var(--neg-l);}
  .b.dgr:active{background:var(--neg-ll);}
  .b.dgrf{background:var(--neg);color:#fff;}
  .b.dgrf:hover{background:var(--neg-d);}
  .b.dgrf:active{background:#8F1000;}
  .b.sm{padding:7px 12px;font-size:13px;}
  .b.lg{padding:14px 22px;font-size:15px;}
  .b.full{width:100%;}
  .b[disabled]{opacity:.32;cursor:not-allowed;transform:none;}
  .b[disabled]:hover,.b[disabled]:active{background:var(--mono1000);transform:none;}
  .b.pri[disabled]:hover,.b.pri[disabled]:active{background:var(--blue);}
  .b.sec[disabled]:hover,.b.sec[disabled]:active{background:var(--mono200);}
  .b.min[disabled]:hover,.b.min[disabled]:active{background:transparent;}

  /* ---------- shell ---------- */
  .top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;border-bottom:1px solid var(--mono300);flex-wrap:wrap;}
  .brand{display:flex;align-items:baseline;gap:10px;}
  .brand b{font-size:18px;font-weight:600;letter-spacing:-.01em;}
  .brand span{font-size:12px;color:var(--mono700);}
  .navs{display:flex;gap:4px;}
  .nv{padding:8px 14px;border:none;border-radius:var(--r);font-size:14px;font-weight:500;background:transparent;color:var(--mono800);transition:background .12s,color .12s;}
  .nv:hover{background:var(--mono200);color:var(--mono1000);}
  .nv:active{background:var(--mono300);}
  .nv.on{background:var(--mono1000);color:var(--mono100);}
  .nv.on:hover{background:var(--mono900);color:var(--mono100);}
  .wrap{max-width:900px;margin:0 auto;padding:28px 24px 80px;}
  .wrap.wide{max-width:1080px;}
  .wrap.run{max-width:660px;padding-top:40px;}

  #tt h1{font-size:28px;font-weight:600;letter-spacing:-.02em;margin:0 0 6px;}
  #tt h2{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0 0 4px;}
  .sub{font-size:14px;color:var(--mono700);margin:0 0 20px;}
  .lbl{display:block;font-size:12px;font-weight:600;color:var(--mono800);margin-bottom:6px;}
  .mut{color:var(--mono700);font-size:13px;}
  .tiny{color:var(--mono700);font-size:12px;}
  .sp{flex:1;}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;}

  .in{width:100%;border:2px solid var(--mono300);border-radius:var(--r);padding:11px 14px;font-size:14px;background:var(--mono200);color:var(--mono1000);outline:none;transition:border-color .12s,background .12s;}
  .in:hover{border-color:var(--mono400);}
  .in:focus{border-color:var(--mono1000);background:var(--mono100);}
  textarea.in{min-height:150px;resize:vertical;line-height:1.7;}

  .card{border:1px solid var(--mono300);border-radius:12px;padding:20px;margin-bottom:16px;}
  .card.flat{background:var(--mono200);border-color:transparent;}
  .note{background:var(--blue-l);border-radius:var(--r);padding:12px 14px;font-size:13px;color:var(--mono900);margin-bottom:16px;line-height:1.6;}
  .note.warn{background:var(--warn-l);}
  .err{color:var(--neg);font-size:13px;margin-top:8px;}
  .empty{text-align:center;padding:44px 20px;color:var(--mono700);font-size:14px;}

  .ovl{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:9999;}
  .mdl{background:#fff;border-radius:14px;padding:24px;max-width:420px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.22);}
  .mdl h3{font-size:18px;font-weight:600;margin:0 0 8px;}
  .mdl p{font-size:14px;color:var(--mono800);margin:0 0 18px;line-height:1.6;white-space:pre-wrap;}

  .steps{display:flex;margin-bottom:24px;border-bottom:1px solid var(--mono300);}
  .stp{padding:12px 4px;margin-right:28px;border:none;background:transparent;font-size:14px;font-weight:600;color:var(--mono600);border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:8px;transition:color .12s,border-color .12s;}
  .stp:hover{color:var(--mono900);border-bottom-color:var(--mono400);}
  .stp:active{color:var(--mono1000);}
  .stp.on{color:var(--mono1000);border-bottom-color:var(--mono1000);}
  .stp .n{width:20px;height:20px;border-radius:50%;background:var(--mono300);color:var(--mono800);font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700;transition:background .12s;}
  .stp.on .n{background:var(--mono1000);color:#fff;}

  /* ---------- editor tree ---------- */
  .tshell{display:flex;gap:16px;align-items:flex-start;}
  .tree{flex:1;border:1px solid var(--mono300);border-radius:12px;padding:8px;min-height:300px;overflow:auto;}
  .nd{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;border:2px solid transparent;transition:background .1s,border-color .1s;}
  .nd:hover{background:var(--mono200);}
  .nd.sel{border-color:var(--blue);background:var(--blue-l);}
  .nd.sel:hover{background:var(--blue-ll);}
  .tw{width:22px;height:22px;flex:0 0 22px;display:flex;align-items:center;justify-content:center;border:none;background:transparent;color:var(--mono700);font-size:10px;border-radius:4px;transition:background .1s,color .1s;}
  .tw:hover{background:var(--mono300);color:var(--mono1000);}
  .tw:active{background:var(--mono400);}
  .tw.leaf{color:var(--mono500);cursor:default;}
  .tw.leaf:hover{background:transparent;color:var(--mono500);}
  .ni{flex:1;border:none;background:transparent;padding:6px 8px;font-size:14px;color:var(--mono1000);outline:none;border-radius:6px;min-width:60px;}
  .ni:hover{background:rgba(0,0,0,.03);}
  .ni:focus{background:#fff;box-shadow:inset 0 0 0 2px var(--mono1000);}
  .cnt{font-size:11px;color:var(--mono600);padding-right:6px;}
  .tools{position:sticky;top:16px;flex:0 0 44px;display:flex;flex-direction:column;gap:4px;border:1px solid var(--mono300);border-radius:12px;padding:6px;}
  .tl{width:30px;height:30px;border:none;background:transparent;border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--mono800);font-size:15px;transition:background .1s,color .1s;}
  .tl:hover{background:var(--mono200);color:var(--mono1000);}
  .tl:active{background:var(--mono300);}
  .tl[disabled]{opacity:.22;cursor:not-allowed;}
  .tl[disabled]:hover{background:transparent;color:var(--mono800);}
  .tl.dgr:hover{background:var(--neg-l);color:var(--neg);}
  .tlsep{height:1px;background:var(--mono300);margin:3px 2px;}

  /* ---------- tasks ---------- */
  .tk{border:1px solid var(--mono300);border-radius:10px;padding:14px;margin-bottom:10px;}
  .tkh{display:flex;gap:10px;align-items:flex-start;}
  .tkn{flex:0 0 24px;height:24px;border-radius:50%;background:var(--mono1000);color:#fff;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .tkt{flex:1;font-size:14px;font-weight:500;line-height:1.5;}
  .ans{display:inline-flex;align-items:center;gap:5px;background:var(--pos-l);color:var(--pos);font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:99px;margin:4px 6px 0 0;}
  .pick{max-height:300px;overflow:auto;border:1px solid var(--mono300);border-radius:var(--r);padding:6px;background:var(--mono200);}
  .pk{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:6px;font-size:13.5px;cursor:pointer;transition:background .1s;}
  .pk:hover{background:var(--mono300);}
  .pk:active{background:var(--mono400);}
  .pk.on{background:var(--blue);color:#fff;}
  .pk.on:hover{background:var(--blue-d);}
  .pk .bx{width:16px;height:16px;flex:0 0 16px;border:2px solid var(--mono600);border-radius:4px;display:flex;align-items:center;justify-content:center;font-size:10px;color:transparent;background:#fff;}
  .pk.on .bx{background:#fff;border-color:#fff;color:var(--blue);}

  /* ---------- run: accordion tree ---------- */
  .prog{height:3px;background:var(--mono300);border-radius:99px;overflow:hidden;margin-bottom:20px;}
  .prog i{display:block;height:100%;background:var(--mono1000);transition:width .25s;}
  .cdbar{height:3px;background:var(--mono300);border-radius:99px;overflow:hidden;margin-bottom:14px;}
  .cdbar i{display:block;height:100%;background:var(--blue);transition:width 1s linear;}

  .rt{border:1px solid var(--mono300);border-radius:12px;padding:6px;margin-bottom:4px;}
  .rn{
    display:flex;align-items:center;gap:10px;width:100%;text-align:left;
    padding:12px 12px;border:2px solid transparent;border-radius:var(--r);
    background:transparent;font-size:15px;font-weight:500;color:var(--mono1000);
    transition:background .12s,border-color .12s,transform .06s;
  }
  .rn:hover{background:var(--mono200);}
  .rn:active{transform:scale(.996);background:var(--mono300);}
  .rn.sel{background:var(--blue-l);border-color:var(--blue);}
  .rn.sel:hover{background:var(--blue-ll);}
  .rn.open{background:var(--mono200);}
  .rn.open.sel{background:var(--blue-l);}
  .rn .cv{
    flex:0 0 20px;width:20px;height:20px;display:flex;align-items:center;justify-content:center;
    color:var(--mono600);font-size:11px;transition:transform .18s,color .12s;
  }
  .rn.open .cv{transform:rotate(90deg);color:var(--mono900);}
  .rn.sel .cv{color:var(--blue);}
  .rn .cv.leafdot{color:var(--mono400);font-size:16px;}
  .rn .lb{flex:1;}
  .rn .ct{font-size:11.5px;color:var(--mono600);font-weight:500;}
  .rn.sel .ct{color:var(--blue-d);}
  .rkids{margin-left:14px;border-left:2px solid var(--mono300);padding-left:6px;}
  .rn.sel + .rkids{border-left-color:var(--blue-ll);}
  .selbar{
    display:flex;align-items:center;gap:8px;background:var(--mono200);border-radius:var(--r);
    padding:10px 14px;font-size:13px;color:var(--mono800);margin:14px 0 10px;
  }
  .selbar b{color:var(--mono1000);font-weight:600;}
  .runbar{display:flex;gap:8px;}

  /* ---------- results ---------- */
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0;}
  .kpi{flex:1;min-width:96px;background:var(--mono200);border-radius:var(--r);padding:12px 14px;}
  .kpi .v{font-size:22px;font-weight:600;letter-spacing:-.02em;}
  .kpi .k{font-size:11.5px;color:var(--mono700);margin-top:1px;}
  .bar{display:flex;align-items:center;gap:10px;margin-bottom:6px;font-size:13px;}
  .bar .nm{flex:0 0 130px;color:var(--mono800);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .bar .tr{flex:1;height:18px;background:var(--mono300);border-radius:4px;overflow:hidden;}
  .bar .tr i{display:block;height:100%;background:var(--blue);}
  .bar .tr i.ok{background:var(--pos);}
  .bar .pc{flex:0 0 62px;text-align:right;color:var(--mono700);font-size:12px;}
  .pl div{font-size:12.5px;padding:7px 0;border-top:1px solid var(--mono300);color:var(--mono800);display:flex;gap:8px;align-items:flex-start;}
  .tag{font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:99px;flex:0 0 auto;}
  .tag.ok{background:var(--pos-l);color:var(--pos);}
  .tag.no{background:var(--neg-l);color:var(--neg);}
  .tag.sk{background:var(--mono300);color:var(--mono800);}

  .li{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--mono300);border-radius:10px;margin-bottom:10px;transition:border-color .12s,background .12s;}
  .li:hover{border-color:var(--mono800);background:var(--mono200);}
  .li .t{flex:1;min-width:0;}
  .li .t b{font-size:15px;font-weight:600;display:block;}
  .bdg{font-size:11px;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--blue-l);color:var(--blue);}
  .code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;background:var(--mono200);padding:3px 8px;border-radius:5px;letter-spacing:.06em;}
  .modeflag{font-size:11px;color:var(--mono600);padding:2px 8px;border-radius:99px;background:var(--mono200);}

  .adminlink{text-align:center;padding:40px 0 24px;}
  .adminlink button{font-size:11.5px;border:none;background:transparent;color:var(--mono500);padding:6px 10px;border-radius:6px;transition:color .12s,background .12s;}
  .adminlink button:hover{color:var(--mono800);background:var(--mono200);}
  .adminlink button:active{background:var(--mono300);}

  .linkbox{display:flex;gap:8px;align-items:center;background:var(--mono200);border-radius:var(--r);padding:10px 12px;}
  .linkbox code{flex:1;min-width:0;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--mono800);}
  .pvbar{display:flex;align-items:center;gap:12px;background:var(--warn-l);border-bottom:1px solid #F0D9A8;padding:10px 24px;font-size:13px;font-weight:600;color:#7A5A12;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;}
  .chip{padding:6px 12px;border:1px solid var(--mono300);border-radius:99px;font-size:12.5px;font-weight:500;background:#fff;color:var(--mono800);transition:background .12s,border-color .12s,color .12s;}
  .chip:hover{border-color:var(--mono800);background:var(--mono200);}
  .chip:active{background:var(--mono300);}
  .chip.on{background:var(--mono1000);border-color:var(--mono1000);color:#fff;}
  .chip.on:hover{background:var(--mono900);}
  .dq{border:1px solid var(--mono300);border-radius:10px;padding:14px;margin-bottom:10px;}
  .dq.mod{background:var(--warn-l);border-color:#F0D9A8;}
  .modtag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:#F0D9A8;color:#7A5A12;margin-left:6px;}
  .opts{display:flex;flex-direction:column;gap:8px;}
  .oq{display:flex;align-items:center;gap:10px;padding:11px 14px;border:2px solid var(--mono300);border-radius:var(--r);font-size:14.5px;background:#fff;color:var(--mono1000);text-align:left;transition:border-color .12s,background .12s;}
  .oq:hover{border-color:var(--mono800);background:var(--mono200);}
  .oq:active{background:var(--mono300);}
  .oq.on{border-color:var(--blue);background:var(--blue-l);}
  .oq .rd{width:18px;height:18px;flex:0 0 18px;border:2px solid var(--mono500);border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .oq.on .rd{border-color:var(--blue);}
  .oq.on .rd:after{content:"";width:9px;height:9px;border-radius:50%;background:var(--blue);}
  @media(max-width:640px){
    .tshell{flex-direction:column-reverse;}
    .tools{flex-direction:row;position:static;width:100%;flex:none;}
    .tlsep{width:1px;height:auto;margin:2px 3px;}
    .bar .nm{flex:0 0 90px;}
    .runbar{flex-direction:column;}
    .rkids{margin-left:8px;}
  }
  @media(prefers-reduced-motion:reduce){#tt *{transition:none !important;}}
</style>

<div id="tt"></div>

   Three tiers, chosen by an actual write/read/delete self-test at boot:

   設定步驟見檔案最下方的說明註解。

var SUPABASE_URL = "https://hwexqkdcqwpiuxnvfjyt.supabase.co";
var SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh3ZXhxa2RjcXdwaXV4bnZmanl0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0ODI4NDMsImV4cCI6MjEwMjA1ODg0M30.XGhmgPhMv-_lU89lG6mD29-tpv0ByRgRSsUSQ27ZtFE";

var MEM = {};
var STORE = { tier:"memory", err:null };

var ART = {
  ok:function(){ return typeof window!=="undefined" && window.storage && typeof window.storage.get==="function"; },
  get:async function(k,sh){ var r=await window.storage.get(k,sh); return r&&r.value!=null?r.value:null; },
  set:async function(k,v,sh){ await window.storage.set(k,v,sh); },
  del:async function(k,sh){ await window.storage.delete(k,sh); },

    }catch(e){ return false; }
  },
  get:async function(k){ var v=localStorage.getItem(P+k); return v==null?null:v; },

/* Supabase (PostgREST) — a single kv table, called straight from the browser. */
var SB = {

      headers:SB._h({"Prefer":"resolution=merge-duplicates,return=minimal"}),
      body:JSON.stringify([{key:k,value:v}])
    });
    if(!r.ok) throw new Error("HTTP "+r.status+" "+(await r.text()).slice(0,120));
  },
  del:async function(k){
    var r=await fetch(SB._base()+"?key=eq."+encodeURIComponent(k),{method:"DELETE",headers:SB._h()});
    if(!r.ok) throw new Error("HTTP "+r.status);
  },
  list:async function(pre){
    var q=SB._base()+"?select=key";
    if(pre) q+="&key=like."+encodeURIComponent(pre+"*");
    var r=await fetch(q,{headers:SB._h()});
    if(!r.ok) throw new Error("HTTP "+r.status);
    var j=await r.json();
    return (j||[]).map(function(x){ return x.key; });
  }
};

var DRV = MEMD;      // shared data (tests, responses)
var DEVICE = MEMD;   // per-device data (am I the admin on this machine?)

/* Prove a tier really works before trusting it: write, read back, compare, clean up. */
async function proveTier(drv,sh){
  var probe="__selftest", val=JSON.stringify({v:Date.now()});
  await drv.set(probe,val,sh);
  var back=await drv.get(probe,sh);
  await drv.del(probe,sh);
  if(back!==val) throw new Error("write succeeded but read back did not match");
  return true;
}
async function initStorage(){
  // Per-device lane first: "am I admin here" must never be shared across devices,
  // or every participant would inherit admin rights.
  DEVICE = LOC.ok() ? LOC : MEMD;

  if(SB.ok()){
    try{ await proveTier(SB); DRV=SB; STORE.tier="cloud"; STORE.err=null; return; }
    catch(e){ STORE.err="雲端連線失敗，已退回本機模式："+(e&&e.message||e); }
  }
  if(ART.ok()){
    try{ await proveTier(ART,true); DRV=ART; STORE.tier="artifact"; return; }
    catch(e){ STORE.err="共享儲存無法寫入："+(e&&e.message||e); }
  }
  if(LOC.ok()){
    try{ await proveTier(LOC); DRV=LOC; STORE.tier="local"; if(!SB.ok()) STORE.err=null; return; }
    catch(e){ STORE.err="本機儲存無法寫入："+(e&&e.message||e); }
  } else if(!ART.ok()){
    STORE.err="這個瀏覽器不允許本機儲存（可能是無痕模式，或以 file:// 開啟時的隱私限制）。";
  }
  DRV=MEMD; STORE.tier="memory";
}

// sh === false  -> per-device lane (never leaves this browser)
// otherwise     -> shared lane (whatever tier won initStorage)
function lane(sh){ return sh===false ? DEVICE : DRV; }
function ns(k,sh){ return sh===false ? "dev::"+k : k; }

async function sg(k,sh){
  try{
    var v=await lane(sh).get(ns(k,sh), sh===false?false:true);
    return v==null?null:JSON.parse(v);
  }catch(e){ return null; }
}
async function ss(k,v,sh){
  // Deliberately NOT swallowed: boot and the setup screen rely on this throwing.
  await lane(sh).set(ns(k,sh), JSON.stringify(v), sh===false?false:true);
  return true;
}
async function sd(k,sh){
  try{ await lane(sh).del(ns(k,sh), sh===false?false:true); }catch(e){}
}
async function sl(p,sh){
  try{ return await lane(sh).list(p, sh===false?false:true)||[]; }catch(e){ return []; }
}

// Hash shape: #/t/<code>[?dq_<questionId>=<value>&...]
// The query part lets a link pre-answer "filled by moderator" style questions
// (e.g. real user vs proxy) so remote participants never see them — the answer
// travels with the link, not with a person standing next to them.
function readHash(){
  try{
    var h=(location.hash||"").replace(/^#/,"");
    var qi=h.indexOf("?");
    var path=qi>=0?h.slice(0,qi):h;
    var qs=qi>=0?h.slice(qi+1):"";
    var m=path.match(/^\/t\/([A-Za-z0-9]+)$/);
    if(!m) return null;
    var tags={};
    qs.split("&").forEach(function(pair){
      if(!pair) return;
      var eq=pair.indexOf("=");
      if(eq<0) return;
      var k=decodeURIComponent(pair.slice(0,eq)), v=decodeURIComponent(pair.slice(eq+1));
      if(k.indexOf("dq_")===0) tags[k.slice(3)]=v;
    });
    return { code:m[1].toUpperCase(), tags:tags };
  }catch(e){ return null; }
}
function baseUrl(){
  try{ return location.href.split("#")[0]; }catch(e){ return ""; }
}
function shareUrl(code,tags){
  var u=baseUrl()+"#/t/"+code;
  var qs=Object.keys(tags||{}).filter(function(k){return tags[k];})
    .map(function(k){ return "dq_"+encodeURIComponent(k)+"="+encodeURIComponent(tags[k]); });
  return qs.length ? u+"?"+qs.join("&") : u;
}

async function boot(){

  var pass=await sg("passcode");

  var idx=await sg("index")||[];
  var act=await sg("active");
  // A participant link identifies its own test and never shows the admin UI.
  if(S.guestCode){
    S.role="guest"; S.index=idx; S.activeId=act;
    var hit=idx.filter(function(x){ return (x.code||"").toUpperCase()===S.guestCode; })[0];
    if(hit){ await enterRun(hit.id,false,hashInfo.tags); S.guestMissing=false; }
    else { S.guestMissing=true; }
    S.ready=true; R(); return;
  }
  if(!pass){ S.needSetup=true; S.ready=true; S.index=idx; S.activeId=act; R(); return; }
  S.role = myrole==="admin" ? "admin" : "guest";
  if(!idx.length && S.role==="admin"){
    var t=seedTest();
    try{
      await ss("t:"+t.id,t);
      idx=[{id:t.id,name:t.name,code:t.code,updatedAt:Date.now()}];
      await ss("index",idx); await ss("active",t.id); act=t.id;
    }catch(e){

      idx=[{id:t.id,name:t.name,code:t.code,updatedAt:Date.now()}]; act=t.id;
      MEM["t:"+t.id]=JSON.stringify(t); MEM["index"]=JSON.stringify(idx); MEM["active"]=JSON.stringify(act);
    }
  }
  S.index=idx; S.activeId=act; S.ready=true;
  if(S.role==="admin") S.view="home"; else await enterRun(act);
  R();

/* ============ tree helpers ============ */
function walk(n,fn,d,p){ d=d||0; fn(n,d,p||null); (n.children||[]).forEach(function(c){walk(c,fn,d+1,n);}); }
function findNode(n,id){ if(n.id===id)return n; var c=n.children||[]; for(var i=0;i<c.length;i++){var r=findNode(c[i],id); if(r)return r;} return null; }
function findParent(n,id,p){ if(n.id===id)return p||null; var c=n.children||[]; for(var i=0;i<c.length;i++){var r=findParent(c[i],id,n); if(r)return r;} return null; }
function idPath(tr,id){ var o=null; (function rec(n,a){ var b=n.id==="root"?a:a.concat([n]); if(n.id===id){o=b;return;} (n.children||[]).forEach(function(c){rec(c,b);}); })(tr,[]); return o||[]; }
function pathTo(tr,id){ return idPath(tr,id).map(function(n){return n.label;}); }
function countDesc(n){ var c=0; walk(n,function(){c++;}); return c-1; }
function flatList(tr){ var o=[]; walk(tr,function(n,d){ if(n.id!=="root") o.push({id:n.id,label:n.label,depth:d-1}); }); return o; }
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){var j=(Math.random()*(i+1))|0,t=a[i];a[i]=a[j];a[j]=t;} return a; }

/* ============ dom ============ */
function e(tag,at,ch){
  var n=document.createElement(tag); at=at||{};
  Object.keys(at).forEach(function(k){
    if(at[k]==null||at[k]===false) return;
    if(k==="class")n.className=at[k];
    else if(k==="html")n.innerHTML=at[k];
    else if(k.slice(0,2)==="on")n.addEventListener(k.slice(2),at[k]);
    else if(k==="value")n.value=at[k];
    else if(k==="checked")n.checked=!!at[k];
    else n.setAttribute(k,at[k]);
  });
  (ch||[]).forEach(function(c){ if(c==null||c===false)return; n.appendChild(typeof c==="string"?document.createTextNode(c):c); });
  return n;
}

function parseOutline(txt){
  var ls=(txt||"").split("\n").filter(function(l){return l.trim().length;});
  if(!ls.length) return null;
  var kids=[],stack=[{d:-1,c:kids}];
  for(var i=0;i<ls.length;i++){
    var ind=ls[i].match(/^(\s*)/)[1].replace(/\t/g,"  ").length;
    var d=Math.floor(ind/2), n=N(ls[i].trim());
    while(stack.length&&stack[stack.length-1].d>=d) stack.pop();
    if(!stack.length) return null;
    stack[stack.length-1].c.push(n); stack.push({d:d,c:n.children});
  }
  return kids;
}

    tw, input, has?e("span",{class:"cnt"},[String(kids.length)]):null ]));

function addChild(t,id){
  var n=findNode(t.tree,id); if(!n) return;
  n.children=n.children||[]; var nn=N("新項目"); n.children.push(nn);
  delete S.collapsed[id]; S.sel=nn.id; S.refocus={id:nn.id,select:true}; R();
}
function addSibling(t,id){
  var p=findParent(t.tree,id); if(!p) return;
  var i=p.children.findIndex(function(c){return c.id===id;});
  var nn=N("新項目"); p.children.splice(i+1,0,nn);
  S.sel=nn.id; S.refocus={id:nn.id,select:true}; R();
}
function move(t,id,dir){
  var p=findParent(t.tree,id); if(!p) return;
  var i=p.children.findIndex(function(c){return c.id===id;});
  var j=i+dir; if(j<0||j>=p.children.length) return;
  var tmp=p.children[i]; p.children[i]=p.children[j]; p.children[j]=tmp;
  S.sel=id; S.refocus={id:id,select:false}; R();
}

/* ============ RUN ============ */
async function enterRun(id,preview,linkTags){
  stopCd();
  var t=id?await sg("t:"+id):null, n=1;
  if(t){
    var ks=await sl("s:"+id+":"), pids={};
    for(var i=0;i<ks.length;i++){ var v=await sg(ks[i]); if(v&&v.pid) pids[v.pid]=1; }
    n=Object.keys(pids).length+1;
  }
  // linkTags: pre-answered demographic values carried by the URL itself (see readHash).
  // Only values matching a real question id on this test are trusted.
  var demo={}, tagged={};
  if(linkTags && t && t.demographics){
    var ids={}; t.demographics.forEach(function(q){ ids[q.id]=q; });
    Object.keys(linkTags).forEach(function(qid){
      if(ids[qid] && ids[qid].options.indexOf(linkTags[qid])>=0){ demo[qid]=linkTags[qid]; tagged[qid]=true; }
    });
  }
  S.run={ phase:"intro", testId:id, test:t, cd:5, pid:(preview?"預覽":"P"+String(n).padStart(2,"0")),
          order:[], idx:0, open:{}, sel:null, opened:[], t0:0, timer:null,
          preview:!!preview, demo:demo, tagged:tagged, demoErr:"" };
  S.view="run";
}
function stopCd(){ if(S.run&&S.run.timer){ clearInterval(S.run.timer); S.run.timer=null; } }

function vRun(w){
  var r=S.run,t=r.test;
  if(!t||!t.tasks||!t.tasks.length){ w.appendChild(e("div",{class:"empty"},["這份測試尚未設定任務。"])); return; }
  if(r.preview){
    w.appendChild(e("div",{class:"pvbar",style:"margin:-40px -24px 24px;border-radius:0"},[
      e("span",{},["預覽模式　作答不會被記錄"]),
      e("div",{class:"sp"}),
      e("button",{class:"b sm",style:"background:#7A5A12;color:#fff",onclick:function(){
        stopCd(); S.view="home"; R();
      }},["離開預覽"])
    ]));
  }

  if(r.phase==="intro"){
    if(!r.timer){
      r.timer=setInterval(function(){
        r.cd--; if(r.cd<=0){ stopCd(); r.cd=0; }
        var b=root.querySelector("#cdbtn"), bar=root.querySelector("#cdbar i");
        if(bar) bar.style.width=((5-r.cd)/5*100)+"%";
        if(b){ b.disabled=r.cd>0; b.textContent=r.cd>0?("請先閱讀說明（"+r.cd+"）"):"我了解了，開始"; }
      },1000);
    }
    w.appendChild(e("h1",{},[t.name]));
    w.appendChild(e("div",{class:"card",style:"margin-top:14px"},
      (t.intro||"").split("\n").map(function(p){
        return p.trim()?e("p",{style:"font-size:15px;line-height:1.75;color:var(--mono900);margin:0 0 14px"},[p]):null;
      }).concat([e("p",{style:"font-size:15px;line-height:1.75;color:var(--mono900);margin:0"},
        ["共 "+t.tasks.length+" 個情境，預計 8–10 分鐘。選單可以隨時展開或收合，選好後按下方的確認按鈕。"])])
    ));
    w.appendChild(e("div",{class:"cdbar",id:"cdbar"},[e("i",{style:"width:"+((5-r.cd)/5*100)+"%"})]));
    w.appendChild(e("button",{class:"b pri lg full",id:"cdbtn",disabled:r.cd>0,onclick:function(){ stopCd(); r.phase="id"; R(); }},
      [r.cd>0?("請先閱讀說明（"+r.cd+"）"):"我了解了，開始"]));
    return;
  }

  if(r.phase==="id"){
    var qs=(t.demographics||[]);
    // Pre-tagged by the link (batch links, see settings) — never shown as a question.
    var tagged=qs.filter(function(q){return r.tagged&&r.tagged[q.id];});
    // "By moderator" questions that this particular link did NOT pre-answer —
    // this only happens with the plain (untagged) link, so fall back to asking

    var toAsk=qs.filter(function(q){return !(r.tagged&&r.tagged[q.id]);});
    var mine=toAsk.filter(function(q){return !q.byModerator;});
    var modq=toAsk.filter(function(q){return q.byModerator;});

    w.appendChild(e("p",{class:"sub"},[ mine.length
      ? "請確認編號並回答幾個分類問題。這些答案只用於分組解讀結果，不會用來識別您個人。"
      : "請確認您的受測者編號，若主持人另有指定請直接修改。" ]));

    var c=e("div",{class:"card"});
    c.appendChild(e("span",{class:"lbl"},["受測者編號"]));
    var pi=e("input",{class:"in"}); pi.value=r.pid; pi.addEventListener("input",function(ev){r.pid=ev.target.value;});
    c.appendChild(pi);
    c.appendChild(e("div",{class:"tiny",style:"margin-top:8px"},["測試代號："+(t.code||"—")]));
    w.appendChild(c);

    if(tagged.length){
      w.appendChild(e("div",{class:"note"},
        tagged.map(function(q){ return q.label+"："+r.demo[q.id]; }).reduce(function(acc,line,i){

      ]));

    }

    w.appendChild(e("button",{class:"b pri lg full",onclick:function(){
      var miss=qs.filter(function(q){ return q.required && !r.demo[q.id]; });
      if(miss.length){ r.demoErr="請先回答：「"+miss[0].label+"」"; R(); return; }
      r.demoErr="";
      var o=t.tasks.map(function(_,i){return i;});
      r.order=t.randomize!==false?shuffle(o):o;
      r.phase="task"; r.idx=0; beginTask();
    }},["開始第一題"]));

  }

  if(r.phase==="done"){
    w.appendChild(e("div",{style:"text-align:center;padding:60px 10px"},[
      e("div",{style:"font-size:40px;margin-bottom:12px"},["✓"]),
      e("h1",{},[r.preview?"預覽結束":"測試完成，謝謝您！"]),
      e("p",{class:"sub"},[r.preview?"這次作答沒有被記錄。":"您的回答已經送出，可以關閉這個頁面了。"]),
      r.preview

        : e("button",{class:"b sec",onclick:function(){ enterRun(r.testId,false).then(R); }},["換下一位受測者"])
    ]));
    return;
  }

  /* --- task: accordion tree --- */
  var task=t.tasks[r.order[r.idx]];
  var selNode=r.sel?findNode(t.tree,r.sel):null;

  w.appendChild(e("div",{class:"prog"},[e("i",{style:"width:"+(r.idx/r.order.length*100)+"%"})]));

  var box=e("div",{class:"rt"});
  (t.tree.children||[]).forEach(function(c){ runNode(box,c,t); });
  w.appendChild(box);

  var anyOpen=Object.keys(r.open).some(function(k){return r.open[k];});
  w.appendChild(e("div",{class:"row",style:"justify-content:flex-end;margin-bottom:4px"},[
    anyOpen?e("button",{class:"b min sm",onclick:function(){ r.open={}; R(); }},["全部收合"]):null
  ]));

  w.appendChild(e("div",{class:"selbar"},[
    selNode ? e("span",{},["目前選擇：",e("b",{},[pathTo(t.tree,selNode.id).join(" › ")])])
            : e("span",{},["尚未選擇任何項目"])
  ]));

  var bar=e("div",{class:"runbar"});
  bar.appendChild(e("button",{class:"b pri lg",style:"flex:1",disabled:!selNode,onclick:function(){
    finish(selNode.id,false);
  }},[ selNode?("確認選擇「"+selNode.label+"」"):"請先選擇一個項目" ]));
  w.appendChild(bar);

  w.appendChild(e("button",{class:"b min full",style:"margin-top:8px;color:var(--mono700)",onclick:function(){
    openModal({title:"確定找不到嗎？",body:"這一題會記錄為「找不到」。這對我們同樣是有用的資訊。",
      confirmText:"是，我找不到",onConfirm:function(){ closeModal(); finish(null,true); }});
  }},["我找不到"]));
}

function demoBlock(q,isMod){
  var r=S.run;
  var box=e("div",{class:"card",style:isMod?"border-color:#F0D9A8":""});
  box.appendChild(e("div",{style:"font-size:15px;font-weight:600;margin-bottom:10px"},[
    q.label, q.required?e("span",{style:"color:var(--neg);margin-left:4px"},["*"]):null
  ]));
  var opts=e("div",{class:"opts"});
  q.options.forEach(function(o){
    var on=r.demo[q.id]===o;
    opts.appendChild(e("button",{class:"oq"+(on?" on":""),onclick:function(){
      r.demo[q.id]=o; r.demoErr=""; R();
    }},[ e("span",{class:"rd"}), e("span",{},[o]) ]));
  });
  box.appendChild(opts);
  return box;
}

function runNode(ct,node,t){
  var r=S.run, kids=node.children||[], has=kids.length>0, open=!!r.open[node.id], sel=r.sel===node.id;
  ct.appendChild(e("button",{class:"rn"+(sel?" sel":"")+(open?" open":""),onclick:function(){
    r.sel=node.id;
    if(has){
      if(r.open[node.id]) delete r.open[node.id];
      else { r.open[node.id]=true; if(r.opened.indexOf(node.id)<0) r.opened.push(node.id); }
    }
    R();
  }},[
    e("span",{class:"cv"+(has?"":" leafdot")},[has?"▶":"·"]),
    e("span",{class:"lb"},[node.label]),
    has?e("span",{class:"ct"},[kids.length+" 項"]):null
  ]));
  if(has&&open){
    var sub=e("div",{class:"rkids"});
    kids.forEach(function(c){ runNode(sub,c,t); });
    ct.appendChild(sub);
  }
}

function beginTask(){ var r=S.run; r.open={}; r.sel=null; r.opened=[]; r.t0=Date.now(); R(); }

async function finish(nodeId,skipped){
  var r=S.run,t=r.test,task=t.tasks[r.order[r.idx]];
  var chain=nodeId?idPath(t.tree,nodeId):[];
  var chainIds={}; chain.forEach(function(n){chainIds[n.id]=1;});
  // direct = never opened a branch outside the final answer's own ancestry
  var direct = !skipped && r.opened.every(function(id){ return chainIds[id]; });
  var rec={
    taskId:task.id, taskText:task.text, pid:r.pid||"匿名",
    path:chain.map(function(n){return {id:n.id,label:n.label};}),
    firstClick: r.opened.length ? (findNode(t.tree,r.opened[0])||{}).label : (nodeId?(findNode(t.tree,nodeId)||{}).label:null),
    finalId:nodeId, finalLabel:nodeId?(findNode(t.tree,nodeId)||{}).label:null,
    correct: !skipped && task.correct.indexOf(nodeId)>=0,
    skipped:!!skipped, direct:direct,
    exploredCount:r.opened.length,
    sec:Math.round((Date.now()-r.t0)/1000), ts:Date.now()
  };
  rec.demo = JSON.parse(JSON.stringify(r.demo||{}));
  if(!r.preview){ try{ await ss("s:"+r.testId+":"+uid(),rec); }catch(err){} }
  if(r.idx+1<r.order.length){ r.idx++; beginTask(); } else { r.phase="done"; R(); }
}

/* ============ RESULTS ============ */
async function openResults(id){
  S.view="results"; S.res={testId:id,test:null,rows:null,loading:true,filters:{}}; R();
  var t=await sg("t:"+id), rows=[], ks=await sl("s:"+id+":");
  for(var i=0;i<ks.length;i++){ var v=await sg(ks[i]); if(v){ v._key=ks[i]; rows.push(v); } }
  S.res={testId:id,test:t,rows:rows,loading:false,filters:{}}; R();
}
function vResults(w){
  var res=S.res;
  if(res.loading){ w.appendChild(e("div",{class:"empty"},["讀取結果中…"])); return; }
  if(!res.test){
    w.appendChild(e("div",{class:"row",style:"margin-bottom:14px"},[
      e("button",{class:"b min sm",onclick:function(){ S.view="home"; R(); }},["← 返回列表"])
    ]));
    w.appendChild(e("div",{class:"empty"},["找不到這份測試。"])); return;
  }
  var t=res.test, rows=res.rows||[], pids={};
  rows.forEach(function(r){pids[r.pid]=1;});
  w.appendChild(e("div",{class:"row",style:"margin-bottom:14px"},[
    e("button",{class:"b min sm",onclick:function(){ S.view="home"; R(); }},["← 返回列表"])
  ]));
  w.appendChild(e("div",{class:"row",style:"margin-bottom:16px;align-items:flex-start"},[
    e("div",{style:"flex:1;min-width:200px"},[
      e("h1",{},[t.name]),
      e("div",{class:"row",style:"gap:8px"},[
        e("span",{class:"code"},[t.code||"—"]),
        e("span",{class:"mut"},[Object.keys(pids).length+" 位受測者 · "+rows.length+" 筆作答"])
      ])
    ]),
    e("button",{class:"b sec sm",onclick:function(){ openResults(res.testId); }},["重新整理"]),
    rows.length?e("button",{class:"b sec sm",onclick:function(){ csv(t,rows); }},["匯出 CSV"]):null,
    rows.length?e("button",{class:"b dgr sm",onclick:function(){ askReset(t,rows); }},["清空結果"]):null
  ]));
  if(!rows.length){ w.appendChild(e("div",{class:"empty"},["還沒有任何作答資料。"])); return; }

  // participant filters — the doc warns mixed groups make the data uninterpretable
  var allRows=rows;
  var dq=(t.demographics||[]);
  if(dq.length){
    var fc=e("div",{class:"card flat"});
    fc.appendChild(e("span",{class:"lbl"},["依受測者分組檢視"]));
    dq.forEach(function(q){
      var present={};
      allRows.forEach(function(r){ var v=r.demo&&r.demo[q.id]; if(v) present[v]=(present[v]||0)+1; });
      var keys=Object.keys(present);
      if(!keys.length) return;
      var line=e("div",{style:"margin-bottom:10px"});
      line.appendChild(e("div",{class:"tiny",style:"margin-bottom:5px"},[q.label]));
      var chips=e("div",{class:"chips"});
      chips.appendChild(e("button",{class:"chip"+(!S.res.filters[q.id]?" on":""),onclick:function(){
        delete S.res.filters[q.id]; R();
      }},["全部"]));
      keys.forEach(function(k){
        chips.appendChild(e("button",{class:"chip"+(S.res.filters[q.id]===k?" on":""),onclick:function(){
          if(S.res.filters[q.id]===k) delete S.res.filters[q.id]; else S.res.filters[q.id]=k;
          R();
        }},[k+"（"+present[k]+"）"]));
      });
      line.appendChild(chips);
      fc.appendChild(line);
    });
    w.appendChild(fc);
  }
  var active=Object.keys(S.res.filters);
  if(active.length){
    rows=rows.filter(function(r){
      return active.every(function(qid){ return r.demo && r.demo[qid]===S.res.filters[qid]; });
    });
    var fp={}; rows.forEach(function(r){fp[r.pid]=1;});
    w.appendChild(e("div",{class:"note"},[
      "已篩選：顯示 "+Object.keys(fp).length+" 位受測者、"+rows.length+" 筆作答（總計 "+allRows.length+" 筆）。"
    ]));
    if(!rows.length){ w.appendChild(e("div",{class:"empty"},["這個組合沒有符合的資料。"])); return; }
  }

  var ok=rows.filter(function(r){return r.correct;}).length;
  var dir=rows.filter(function(r){return r.direct;}).length;
  var sk=rows.filter(function(r){return r.skipped;}).length;
  w.appendChild(e("div",{class:"kpis"},[
    kpi(Math.round(ok/rows.length*100)+"%","整體成功率"),
    kpi(Math.round(dir/rows.length*100)+"%","整體直達率"),
    kpi(Math.round(sk/rows.length*100)+"%","找不到比例"),
    kpi(Math.round(rows.reduce(function(a,r){return a+r.sec;},0)/rows.length)+"s","平均用時")
  ]));
  w.appendChild(e("div",{class:"note warn"},["本輪無對照組，整體分數僅供概覽。結論請以逐題的問題清單為主——特別是成功率偏低題目的首次點擊分布與實際終點。"]));

  t.tasks.forEach(function(task,i){
    var rs=rows.filter(function(r){return r.taskId===task.id;});
    var card=e("div",{class:"card"});
    card.appendChild(e("div",{class:"tkh"},[
      e("div",{class:"tkn"},[String(i+1)]),
      e("div",{class:"tkt"},[task.text,task.note?e("div",{class:"tiny",style:"margin-top:3px"},[task.note]):null])
    ]));
    if(!rs.length){ card.appendChild(e("p",{class:"mut",style:"margin-top:10px"},["尚無資料"])); w.appendChild(card); return; }
    var o=rs.filter(function(r){return r.correct;}).length, rate=Math.round(o/rs.length*100);
    card.appendChild(e("div",{class:"kpis"},[
      kpi(rate+"%","成功率",rate<60),
      kpi(Math.round(rs.filter(function(r){return r.direct;}).length/rs.length*100)+"%","直達率"),
      kpi(String(rs.filter(function(r){return r.skipped;}).length),"找不到"),
      kpi(Math.round(rs.reduce(function(a,r){return a+r.sec;},0)/rs.length)+"s","平均用時"),
      kpi(String(rs.length),"樣本數")
    ]));
    var cf={}; task.correct.forEach(function(cid){ var p=pathTo(t.tree,cid); if(p.length) cf[p[0]]=1; });
    dist(card,"首次展開的一級分類",rs,function(r){return r.firstClick||"（未展開）";},cf);
    var cl={}; task.correct.forEach(function(cid){ var n=findNode(t.tree,cid); if(n) cl[n.label]=1; });
    dist(card,"終點分布",rs,function(r){return r.skipped?"（我找不到）":(r.finalLabel||"—");},cl);
    card.appendChild(e("div",{class:"lbl",style:"margin-top:14px"},["逐人路徑"]));
    var pl=e("div",{class:"pl"});
    rs.slice().sort(function(a,b){return a.ts-b.ts;}).forEach(function(r){
      var ps=r.path.map(function(p){return p.label;}).join(" › ")||"—";
      var ex=(r.exploredCount!=null&&!r.direct)?(" · 展開過 "+r.exploredCount+" 個分支"):"";
      pl.appendChild(e("div",{},[
        e("span",{class:"tag "+(r.skipped?"sk":(r.correct?"ok":"no"))},[r.skipped?"找不到":(r.correct?"成功":"失敗")]),
        e("span",{style:"flex:1"},[r.pid+" ｜ "+ps+"  ("+r.sec+"s"+ex+")"])
      ]));
    });
    card.appendChild(pl);
    w.appendChild(card);
  });
}
function dist(card,title,rs,keyfn,cm){
  var m={}; rs.forEach(function(r){ var k=keyfn(r); m[k]=(m[k]||0)+1; });
  card.appendChild(e("div",{class:"lbl",style:"margin-top:14px"},[title]));
  Object.keys(m).sort(function(a,b){return m[b]-m[a];}).forEach(function(k){
    var pc=Math.round(m[k]/rs.length*100);
    card.appendChild(e("div",{class:"bar"},[
      e("span",{class:"nm",title:k},[k]),
      e("span",{class:"tr"},[e("i",{class:cm[k]?"ok":"",style:"width:"+pc+"%"})]),
      e("span",{class:"pc"},[pc+"% ("+m[k]+")"])
    ]));
  });
}
function kpi(v,k,bad){ return e("div",{class:"kpi"},[e("div",{class:"v",style:bad?"color:var(--neg)":""},[v]),e("div",{class:"k"},[k])]); }

function askReset(t,rows){
  var pids={}; rows.forEach(function(r){pids[r.pid]=1;});
  var armed=false;
  function open(){
    openModal({
      title:armed?"再確認一次":"清空測試結果",
      body:armed
        ? "這是最後確認。按下「永久刪除」後，"+rows.length+" 筆作答資料將立即消失且無法復原。\n\n若尚未匯出 CSV，請先取消並匯出。"
        : "「"+t.name+"」目前有 "+Object.keys(pids).length+" 位受測者、"+rows.length+" 筆作答資料。\n\n清空後架構與任務設定會保留，只有作答資料被移除。",
      confirmText:armed?"永久刪除":"我要清空", danger:true,
      onConfirm:async function(){
        if(!armed){ armed=true; closeModal(); open(); return; }
        closeModal(); S.res.loading=true; R();
        for(var i=0;i<rows.length;i++){ if(rows[i]._key) await sd(rows[i]._key); }
        openResults(S.res.testId);
      }
    });
  }
  open();
}
function csv(t,rows){
  var q=function(s){ return '"'+String(s==null?"":s).replace(/"/g,'""')+'"'; };
  var dq=(t.demographics||[]);
  var head=["test_code","task","participant"].concat(dq.map(function(x){return x.label;}))
    .concat(["first_open","final","correct","direct","skipped","explored","seconds","path","timestamp"]);
  var ls=[head.map(q).join(",")];
  rows.forEach(function(r){
    var row=[q(t.code),q(r.taskText),q(r.pid)]
      .concat(dq.map(function(x){ return q(r.demo?r.demo[x.id]:""); }))
      .concat([q(r.firstClick),q(r.finalLabel),r.correct?1:0,r.direct?1:0,r.skipped?1:0,
        (r.exploredCount==null?"":r.exploredCount),r.sec,
        q(r.path.map(function(p){return p.label;}).join(" > ")),q(new Date(r.ts).toISOString())]);
    ls.push(row.join(","));
  });
  var b=new Blob(["\ufeff"+ls.join("\n")],{type:"text/csv;charset=utf-8"});
  var u=URL.createObjectURL(b),a=document.createElement("a");
  a.href=u; a.download=(t.code||"tree")+"_results.csv";
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(u);
}

boot();
})();
</script>

不填 = 本機模式，資料只留在各自的瀏覽器，適合主持人陪同施測。
填了 = 所有裝置的資料匯總到同一處，可以把連結寄出去讓人各自作答。

步驟：

1. supabase.com 註冊，New project（免費方案即可）。
   Region 選 Singapore 或 Tokyo，離台灣近。

2. 左側 SQL Editor，貼上並執行：

   create table kv (
     key   text primary key,
     value text
   );

   alter table kv enable row level security;

   create policy "anon full access" on kv
     for all
     to anon
     using (true)
     with check (true);

3. 左側 Project Settings → API，複製兩個值：
   - Project URL      → 填到本檔案上方的 SUPABASE_URL
   - anon public key   → 填到本檔案上方的 SUPABASE_KEY
   （anon key 本來就是設計成公開的，可以放在前端）

4. 存檔、上傳到 GitHub、等 Pages 重新部署。
   右上角標籤顯示「雲端模式」就成功了。

安全性須知

瀏覽器開發者工具讀取這張表的全部內容，也可以寫入。

這個風險是可接受的。但請注意：

  - 不要在任何欄位填入受測者姓名、電話、email
  - 測試結束後，到 Supabase 的 Table Editor 把資料清掉

若之後要處理真的敏感資料，需改成 Supabase Auth + 逐列權限，那是另一個層級的工。
